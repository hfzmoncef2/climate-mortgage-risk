# Loss given default and stress test (Phase 8). See DECISIONS.md.

lgd:
  follow_up_months: 60         # outcome of each D004 default observed up to 5 years later
                               # (foreclosure can take years); only defaults with D + 60 months
                               # <= performance cutoff are used, whatever their outcome
  flag_lookback_months: 2      # disaster / forbearance flags in the default month or 2 before
  flag_era_start: "2014-01-01" # the disaster flag only exists from January 2014 (as Phase 5)
  default_year_groups:         # default year -> period label
    2005-2008: [2005, 2008]
    2009-2012: [2009, 2012]
    2013-2016: [2013, 2016]
    2017-2021: [2017, 2021]
  ltv_bins: [0, 60, 80, 90, 200]   # origination LTV groups: [0,60), [60,80), [80,90), [90+

scenarios:                     # 24-month expected loss of the recent book (test vintages)
  book_split: test             # loans originated 2021-2024 (PD sample)
  lgd_periods:                 # default periods whose measured LGD is used
    benign: ["2017-2021"]      # recent house-price regime
    downturn: ["2005-2008", "2009-2012"]   # downturn LGD (Basel convention)
  downturn_vintages: [2007, 2008]      # PD multiplier = observed / TTC PD of these vintages
  hurricane:
    delinquency_effect_pp: 1.146       # Phase 5 event study, hurricanes, average k = 1-6
    # extra default probability of an exposed loan = this effect (an upper-end mapping: the
    # 60+ day effect is used as if every extra delinquency became a D004 default), weighted
    # by the ZIP3's share of homes within 50 km of the hurricane coast; every coastal ZIP3 is
    # hit once in the 24 months (a deliberately severe, simultaneous event)
