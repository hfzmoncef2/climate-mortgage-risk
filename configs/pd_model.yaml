# PD model (Phase 7): out-of-time split by vintage. See DECISIONS.md.
split:
  train: [2004, 2014]        # includes the 2007-2008 downturn (through-the-cycle)
  validation: [2015, 2018]   # model selection and tuning only
  test: [2021, 2024]         # evaluated once, after refit on train+validation
# 2019-2020 have no eligible loans (COVID window, D004/PD sample exclusions)

features:
  numeric: [fico, ltv, cltv, dti, log_upb, orig_term, mi_pct, num_borrowers, num_units, spread_bp]
  categorical: [loan_purpose, occupancy, channel, property_type, first_time_buyer,
                super_conforming, state]
  climate: [exposure_main, exposure_broad, recent_events_12m, near_coast_share, log_dist_coast]
  recent_months: 12          # disasters in the 12 months before origination (same availability lag)

scorecard:
  numeric_bins: 10           # Training quantile bins, plus missing
  min_bin_share: 0.005       # Pool rare categories into other
  woe_smoothing: 0.5         # Avoid log(0)
  C: 1.0                    # Inverse L2 penalty
  min_iv: 0.02               # Drop weak features using training data only
  max_corr: 0.8              # Retain higher-IV correlated WoE features

gbm:                         # LightGBM challenger (same features as the scorecard, before selection)
  learning_rate: 0.05
  num_leaves: 31
  min_child_samples: 200     # defaults are rare: large leaves avoid fitting single loans
  subsample: 0.8
  subsample_freq: 1
  colsample_bytree: 0.8
  reg_lambda: 1.0
  n_estimators: 3000         # upper bound; the actual number is set by early stopping
  early_stopping_rounds: 100
  metric: auc                # early-stopping metric: ranking only. Validation has a different
                             # default rate than train, so log loss would also punish the level
                             # (calibration is handled separately, step 5)
  seed: 42

calibration:
  bins: 10                   # equal-count bins of predicted PD for the reliability table

ttc:                         # through-the-cycle anchoring of the final scorecard
  fit_splits: [train, validation]   # the final model is refitted on 2004-2018
  # long-run default rate = simple average of the yearly (vintage) default rates, so that
  # large vintages do not dominate; the PDs are shifted (ranking unchanged) to match it

ablation:                    # does adding the climate features improve the PD model?
  bootstrap: 200             # paired bootstrap of the validation loans for the AUC gain
  seed: 7
  coastal_share: 0.5         # subgroup: ZIP3 with at least half the homes near the coast
  feature_sets:              # climate features added to the base model, one set at a time
    climate_all: [exposure_main, exposure_broad, recent_events_12m, near_coast_share,
                  log_dist_coast]
    climate_static: [near_coast_share, log_dist_coast]   # geography only: no time trend
  psi_bins: 10               # population stability index, train -> validation

final:                       # frozen on the validation results, BEFORE the test vintages are used
  fit_splits: [train, validation]       # refit on 2004-2018
  test_split: test                      # 2021-2024, evaluated once
  climate_features: [near_coast_share, log_dist_coast]   # primary = scorecard + these (D021)
  bootstrap: 500             # bootstrap of test loans for the confidence intervals
  seed: 11
